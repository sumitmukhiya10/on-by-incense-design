<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Set Up Admin | ON BY INCENSE DESIGN</title>
    <link rel="icon" href="/assets/logos/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script type="module" src="/js/admin-setup.js"></script>
  </head>
  <body>
    <main class="admin-shell">
      <div class="admin-brand"><a class="brand" href="/index.html"><img src="/assets/logos/ON_BY_INCENSE_DESIGN_Logo.svg" alt="" width="42" height="42" /><span class="brand-copy"><strong>ON BY <span>INCENSE DESIGN</span></strong><small>STORE ADMIN</small></span></a></div>
      <section class="admin-login-card">
        <h1>Set Up Admin Access</h1>
        <p class="admin-inline-note">Enter the one-time setup code printed in the server window, then choose separate strong Admin and master recovery passwords. Setup can only be completed once.</p>
        <form id="setup-form">
          <label class="field-label" for="setup-code">One-time setup code<input class="input" id="setup-code" autocomplete="off" required /></label>
          <label class="field-label" for="setup-password">Admin password<input class="input" id="setup-password" type="password" autocomplete="new-password" minlength="12" required /><small>At least 12 characters with upper and lower case letters, a number, and a symbol.</small></label>
          <label class="field-label" for="setup-confirm">Confirm password<input class="input" id="setup-confirm" type="password" autocomplete="new-password" minlength="12" required /></label>
          <label class="field-label" for="setup-master-password">Master recovery password<input class="input" id="setup-master-password" type="password" autocomplete="new-password" minlength="12" required /><small>Use this separate password to reset your Admin password if you forget it.</small></label>
          <label class="field-label" for="setup-master-confirm">Confirm master recovery password<input class="input" id="setup-master-confirm" type="password" autocomplete="new-password" minlength="12" required /></label>
          <p class="form-error" id="setup-error" role="alert"></p>
          <button class="button button-dark button-wide" type="submit" id="setup-submit">Create admin password</button>
        </form>
        <p class="admin-inline-note" id="setup-result" role="status"></p>
        <a class="text-link" href="/admin.html">Return to Admin Login</a>
      </section>
    </main>
  </body>
</html>
